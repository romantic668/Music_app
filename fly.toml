app = "music-app-lin"
primary_region = "sea"

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true      # 🟢 闲置时自动停机
  auto_start_machines = true     # 🟢 有流量时自动启动
  min_machines_running = 0       # 🟢 最低可为 0，闲置不收费
  processes = ["app"]

[[vm]]
  memory = "256mb"               # 🟢 建议改 256mb（或最多 512mb）
  cpu_kind = "shared"
  cpus = 1
